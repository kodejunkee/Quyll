[package]
name = "quyll"
version = "0.5.3"
description = "A professional writing workspace for authors"
authors = ["Jayce"]
edition = "2021"

[lib]
name = "quyll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.4"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tokio = { version = "1.53.1", features = ["net", "io-util"] }
urlencoding = "2.1.3"
zip = "8.6.0"
walkdir = "2.5.0"
tauri-plugin-http = "2.5.9"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
debug = 1 # Reduce debug info size to prevent PDB limits on Windows
incremental = true

